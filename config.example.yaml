# NeoPanel Configuration File
server:
  host: "0.0.0.0"
  port: 8080
  mode: "behind_proxy" # "behind_proxy" or "standalone"
  role: "panel"        # "panel" (Master Panel) or "node" (Cluster Node Daemon)
  startup_timeout_seconds: 180
  # Required to enable passkeys: exact browser-facing panel origin (no path), e.g. https://panel.example.com.
  # Passkeys require HTTPS, except http://localhost[:port] development. Forwarded headers are ignored.
  # If empty, passkeys stay unavailable; password sign-in continues to work.
  # The RP hostname is pinned when the first passkey is registered; keep it stable.
  public_url: ""

paths:
  data_dir: "./data"
  servers_dir: "./data/servers"
  db_path: "./data/neopanel.db"

security:
  jwt_secret: "change-this-to-a-very-secure-random-32-byte-hex-string"
  token_expiration_hours: 72
  node_token: ""       # Auto-generated neo_node_... token when running as a cluster node
  passkeys_disabled: false # Disable passkey ceremonies (existing credentials remain stored).
  turnstile:
    enabled: false
    site_key: ""
    secret_key: ""

java:
  default_path: "java"

