# NeoPanel Configuration File
server:
  host: "0.0.0.0"
  port: 8080
  mode: "behind_proxy" # "behind_proxy" or "standalone"
  role: "panel"        # "panel" (Master Panel) or "node" (Cluster Node Daemon)
  startup_timeout_seconds: 180
  # Fallback browser-facing origin for passkeys, invitations, and password-reset links.
  # Admin > Appearance > Panel address saves a SQLite override, effective immediately
  # without a restart. That override takes precedence over this YAML value.
  # Use an exact HTTPS origin (no path/credentials/query/fragment), e.g. https://panel.example.com.
  # Only http://localhost[:port] is allowed for HTTP development. Forwarded headers are ignored.
  # Saving does not configure DNS, HTTPS certificates, or reverse-proxy routing.
  # If neither source is set, passkeys stay unavailable; password sign-in still works.
  # Remove all passkeys from every account before changing the hostname, then re-register.
  # The saved address cannot be cleared. This is separate from the game/SFTP FQDN.
  public_url: ""

paths:
  data_dir: "./data"
  servers_dir: "./data/servers"
  db_path: "./data/neopanel.db"

security:
  jwt_secret: "change-this-to-a-very-secure-random-32-byte-hex-string"
  token_expiration_hours: 72
  node_token: ""       # Auto-generated neo_node_... token when running as a cluster node
  passkeys_disabled: false # Disable passkey ceremonies (existing credentials remain stored).
  turnstile:
    enabled: false
    site_key: ""
    secret_key: ""

java:
  default_path: "java"

