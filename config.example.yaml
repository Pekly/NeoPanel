# NeoPanel Configuration File
server:
  host: "0.0.0.0"
  port: 8080
  mode: "behind_proxy" # "behind_proxy" or "standalone"
  role: "panel"        # "panel" (full Web UI + API) or "node" (headless node daemon only)
  startup_timeout_seconds: 180

paths:
  data_dir: "./data"
  servers_dir: "./data/servers"
  db_path: "./data/neopanel.db"

security:
  jwt_secret: "change-this-to-a-very-secure-random-32-byte-hex-string"
  token_expiration_hours: 72
  node_token: ""       # Auto-generated neo_node_... token when running as a headless node
  turnstile:
    enabled: false
    site_key: ""
    secret_key: ""

java:
  default_path: "java"

