<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="/api/branding/appearance.js"></script>
  <script src="/js/theme-boot.js"></script>
  <title>NeoPanel — Minecraft server management</title>
  <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link id="app-favicon-shortcut" rel="shortcut icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/workbench.css">
  <link rel="stylesheet" href="/css/file-preview.css">
  <link rel="stylesheet" href="/css/find.css">
  <link rel="stylesheet" href="/css/editor-syntax.css">
  <link rel="stylesheet" href="/css/file-drag.css">
  <link rel="stylesheet" href="/css/operation-progress.css">
  <link rel="stylesheet" href="/css/onboarding.css">
  <link rel="stylesheet" href="/css/workspace.css">
  <link rel="stylesheet" href="/css/modal-layout.css">
  <link rel="stylesheet" href="/css/node-wake.css">
  <link rel="stylesheet" href="/css/server-automation.css">
  <link rel="stylesheet" href="/css/proxy-settings.css">
  <link rel="stylesheet" href="/css/features.css">
  <link rel="stylesheet" href="/css/sftp-import.css">
  <link rel="stylesheet" href="/css/world-conversion.css">
  <link rel="stylesheet" href="/css/plugin-details.css">
  <link rel="stylesheet" href="/css/installed-plugins.css">
  <link rel="stylesheet" href="/css/plugin-identities.css">
  <link rel="stylesheet" href="/css/loading.css">
  <link rel="stylesheet" href="/css/server-artifact.css">
  <link rel="stylesheet" href="/css/motion.css">
  <style id="custom-brand-css"></style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div id="np-top-progress" aria-hidden="true"></div>
  <div class="app">
    <!-- Sidebar Navigation -->
    <nav id="nav" aria-label="Main Navigation"></nav>

    <!-- Main Workspace View -->
    <main id="main" tabindex="-1">
      <!-- Neutral pre-auth shell: no account, server or cached private data. -->
      <div class="np-loading np-loading-boot">
        <div class="np-loading-status" role="status" aria-live="polite">Loading NeoPanel...</div>
        <div class="np-load-shapes" aria-hidden="true">
          <div class="np-load-boot-heading"><span class="np-load-bar np-load-title"></span><span class="np-load-bar np-load-short"></span></div>
          <div class="np-load-boot-panels">
            <div class="np-load-item"><span class="np-load-bar np-load-title"></span><div class="np-load-copy"><span class="np-load-bar"></span><span class="np-load-bar"></span><span class="np-load-bar np-load-short"></span></div><div class="np-load-copy"><span class="np-load-bar"></span><span class="np-load-bar np-load-short"></span></div></div>
            <div class="np-load-item"><span class="np-load-bar np-load-title"></span><div class="np-load-copy"><span class="np-load-bar"></span><span class="np-load-bar np-load-short"></span></div><div class="np-load-copy"><span class="np-load-bar"></span><span class="np-load-bar np-load-short"></span></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Notification System -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Modal Container for Dialogs (Create Server, Uploads, Prompts) -->
  <div id="modal-container"></div>

  <!-- On-the-Fly Floating Console Drawer Root -->
  <div id="fly-console-root"></div>

  <!-- Floating Right-Click Context Menu -->
  <div id="floating-ctx" class="floating-ctx-menu" style="display:none;"></div>

  <!-- Drag and Drop Overlay -->
  <div id="dropzone-overlay" class="dropzone-overlay" style="display:none;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4M12 16V3m-5 5 5-5 5 5"/></svg>
    <h2>Drop files here to upload</h2>
    <p>Files will be uploaded directly to the current directory</p>
  </div>

  <!-- Upload Progress Widget -->
  <div id="upload-progress-widget" class="upload-progress-widget" style="display:none;"></div>

  <!-- App Core Script -->
  <script src="/js/loading.js"></script>
  <script src="/js/qol.js"></script>
  <script src="/js/file-preview.js"></script>
  <script src="/js/team.js"></script>
  <script src="/js/automation.js"></script>
  <script src="/js/passkeys.js"></script>
  <script src="/js/motion.js"></script>
  <script src="/js/find-search.js"></script>
  <script src="/js/editor-syntax.js"></script>
  <script src="/js/find.js"></script>
  <script src="/js/file-trash.js"></script>
  <script src="/js/file-drag.js"></script>
  <script src="/js/password-reset.js"></script>
  <script src="/js/operation-progress.js"></script>
  <script src="/js/onboarding.js"></script>
  <script src="/js/workspace.js"></script>
  <script src="/js/panel-domain.js"></script>
  <script src="/js/node-names.js"></script>
  <script src="/js/node-wake.js"></script>
  <script src="/js/node-idle.js"></script>
  <script src="/js/server-automation.js"></script>
  <script src="/js/proxy-settings.js"></script>
  <script src="/js/features.js"></script>
  <script src="/js/ports.js"></script>
  <script src="/js/sftp-import.js"></script>
  <script src="/js/world-conversion.js"></script>
  <script src="/vendor/marked-18.2.1/marked.umd.js"></script>
  <script src="/vendor/dompurify-3.4.18/purify.min.js"></script>
  <script src="/js/project-markdown.js"></script>
  <script src="/js/plugin-details.js"></script>
  <script src="/js/plugin-identities.js"></script>
  <script src="/js/installed-plugins.js"></script>
  <script src="/js/server-artifact.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
