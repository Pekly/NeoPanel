<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeoPanel — Ultra-Light Minecraft Server Manager</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar Navigation -->
    <nav id="nav" aria-label="Main Navigation"></nav>

    <!-- Main Workspace View -->
    <main id="main" tabindex="-1"></main>
  </div>

  <!-- Toast Notification System -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Modal Container for Dialogs (Create Server, Uploads, Prompts) -->
  <div id="modal-container"></div>

  <!-- Floating Right-Click Context Menu -->
  <div id="floating-ctx" class="floating-ctx-menu" style="display:none;"></div>

  <!-- Drag and Drop Overlay -->
  <div id="dropzone-overlay" class="dropzone-overlay" style="display:none;">
    <div style="font-size: 48px;">📂</div>
    <h2>Drop files here to upload</h2>
    <p>Files will be uploaded directly to the current directory</p>
  </div>

  <!-- Upload Progress Widget -->
  <div id="upload-progress-widget" class="upload-progress-widget" style="display:none;"></div>

  <!-- App Core Script -->
  <script src="/js/app.js"></script>
</body>
</html>
